<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>新标签页</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="wallpaper"></div>

    <!-- 右上：天气 + 设置 -->
    <div id="topbar">
        <div id="weather" title="MSN 天气">
            <img id="wx-icon" alt=""><span id="wx-emoji" class="hidden"></span>
            <div class="wx-main">
                <div class="wx-line1"><b id="wx-temp">--°</b><span id="wx-cap"></span></div>
                <div class="wx-line2"><span id="wx-city">西安</span><span id="wx-extra"></span></div>
            </div>
        </div>
        <button id="btn-settings" title="设置"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52.83 52.9"
                id="settings-svg">
                <path fill="var(--icon-color, #fff)"
                    d="M29.73 52.57c-.26-.2-.93-1.41-1.48-2.71-1.1-2.57-1.42-2.93-2.42-2.68-.51.13-.89.66-1.67 2.36-1.2 2.59-1.6 3.11-2.4 3.11-1.1 0-1.35-.58-1.51-3.48-.13-2.38-.23-2.78-.73-3.2-.32-.25-.7-.46-.84-.46s-1.25.95-2.46 2.12c-1.22 1.16-2.38 2.11-2.59 2.11-.52 0-1.25-.86-1.25-1.49 0-.28.3-1.56.67-2.84 1.12-3.84.46-4.31-3.47-2.54-2.15.98-2.6 1.1-3.16.83-1.08-.49-.85-1.45.93-3.9 1.72-2.37 1.91-3.07 1-3.66-.5-.3-1.06-.33-3.2-.11-2.9.29-3.27.22-3.6-.64-.33-.89.05-1.37 2.2-2.83 1.07-.72 2.14-1.5 2.38-1.74 1.1-1.1.16-1.97-2.97-2.78C.38 27.33-.28 26.82.1 25.72c.23-.64.53-.79 2.97-1.42 1.5-.4 2.9-.85 3.1-1.03.77-.63.46-1.54-.84-2.44-2.35-1.62-3.8-2.85-3.8-3.21 0-.2.22-.64.5-.97.48-.6.5-.6 3.35-.3 2.56.29 2.9.27 3.34-.12.27-.24.48-.64.48-.89 0-.24-.7-1.5-1.58-2.8-.88-1.29-1.59-2.53-1.59-2.77 0-.48.8-1.3 1.27-1.3.17 0 1.43.56 2.8 1.24 2.22 1.1 2.59 1.2 3.19.93.84-.38.86-.96.13-3.82-.68-2.68-.61-3.42.36-3.76.68-.24.87-.12 2.91 1.91 1.2 1.2 2.37 2.17 2.6 2.17.88 0 1.26-.89 1.54-3.7C21.13.59 21.4 0 22.44 0c.67 0 1.17.71 2.24 3.23 1.48 3.46 2.38 3.5 3.98.14C29.95.65 30.26.27 31.2.27c1 0 1.19.46 1.38 3.53.09 1.44.3 2.78.46 2.98.68.82 1.61.4 3.7-1.62 1.12-1.1 2.18-1.98 2.35-1.98.17 0 .54.12.82.27.7.38.66 1.39-.2 4.23-.68 2.3-.68 2.38-.21 2.9.66.74 1.06.68 3.67-.53 2.43-1.12 3.04-1.25 3.55-.74.64.64.3 1.64-1.3 3.84-1.28 1.78-1.57 2.35-1.44 2.88.23.9.9 1.09 3.14.86 3.25-.32 3.57-.29 4.05.44.38.6.39.72.03 1.27-.22.34-1.35 1.24-2.52 2-1.16.77-2.17 1.6-2.23 1.85-.25.92.26 1.59 1.44 1.9 3.93 1.02 4.7 1.33 4.86 1.96.3 1.24-.22 1.63-3.05 2.28-4.1.92-4.48 1.93-1.54 3.95 3.15 2.17 3.63 2.89 2.59 3.84-.48.43-.74.45-3.34.15-2.55-.28-2.85-.27-3.3.14-.28.25-.5.65-.5.88 0 .24.7 1.49 1.58 2.78.87 1.29 1.59 2.56 1.59 2.83s-.31.69-.69.93c-.67.44-.74.42-3.3-.83-2.3-1.14-2.68-1.25-3.28-.98-.84.38-.87 1.09-.13 3.74.71 2.56.62 3.5-.36 3.84-.7.25-.86.14-2.88-1.91-3.1-3.16-3.7-2.93-4.14 1.52-.21 2.1-.39 2.85-.74 3.11-.58.43-.93.42-1.53-.01zm.75-10.23c1.12-.29 2.78-.91 3.68-1.39a20.16 20.16 0 0 0 6.23-5.87c1.16-2.37 2.24-4.33 2.02-6.9l-7.43-.07c-6.82-.07-7.46-.03-7.85.4-.77.86-7.08 12.01-7.08 12.51 0 1.57 6.34 2.37 10.43 1.32zm-9.73-9.13c1.96-3.4 3.53-6.38 3.53-6.75 0-1.03-6.91-12.82-7.57-12.91-.74-.11-3.68 3.05-4.8 5.16a16.98 16.98 0 0 0-.02 15.46c1.12 2.1 4.08 5.3 4.8 5.2.39-.06 1.5-1.76 4.06-6.16zm21.18-12.13A17 17 0 0 0 30.1 10.42c-3.53-.89-9.8-.02-10 1.38-.08.5 6.05 11.48 7.03 12.61.38.43 1.02.46 7.84.4l7.43-.07c.19-1.27-.1-2.6-.48-3.66z">
                </path>
            </svg></button>
    </div>

    <main>
        <div id="clock">
            <div id="time">00:00:00</div>
            <div id="dateline"></div>
        </div>

        <div id="searchbar">
            <button id="engine-logo" title="点击切换搜索引擎"><img id="engine-img" alt=""></button>
            <!-- ✅ 新增：横向引擎选择条 -->
            <div class="engine-bar" id="engineBar">
                <div class="engine-bar-list" id="engineBarList"></div>
            </div>
            <input id="search-input" placeholder="搜索或输入网址" autocomplete="off">
            <button id="search-btn" title="搜索">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="#333"
                        d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" />
                </svg>
            </button>
        </div>

        <div id="shortcuts"></div>
    </main>


    <footer id="poetry"></footer>

    <!-- 设置面板 -->
    <div id="panel-mask" class="mask hidden center">
        <aside id="panel">
            <header>设置 <button id="p-close" class="btn">✕</button></header>
            <div id="panel-body">
                <nav id="panel-tabs">
                    <button class="p-tab active" data-tab="weather">天气</button>
                    <button class="p-tab" data-tab="engine">引擎</button>
                    <button class="p-tab" data-tab="shortcuts">快捷方式</button>
                    <button class="p-tab" data-tab="font">字体</button>
                </nav>
                <div id="panel-content">
                    <!-- 天气 -->
                    <section id="tab-weather" class="p-page active">
                        <h3>天气</h3>
                        <div class="row"><label>API Key</label><input id="p-apikey" type="password"></div>
                        <div class="row"><label>城市</label><select id="p-city"></select></div>
                    </section>
                    <!-- 引擎 -->
                    <section id="tab-engine" class="p-page">
                        <h3>搜索引擎</h3>
                        <div id="engine-list"></div>
                        <button id="engine-add" type="button">+ 添加引擎</button>
                    </section>
                    <!-- 快捷方式 -->
                    <section id="tab-shortcuts" class="p-page">
                        <h3>快捷方式</h3>
                        <div class="row"><label>图标大小 <span id="v-size"></span></label><input id="p-size" type="range"
                                min="48" max="96" step="4"></div>
                        <div class="row"><label>列间距 <span id="v-gap"></span></label><input id="p-gap" type="range"
                                min="12" max="48" step="4"></div>
                        <div class="row"><label>行间距 <span id="v-rowgap"></span></label><input id="p-rowgap" type="range"
                                min="12" max="64" step="4"></div>
                        <div class="row">
                            <label>每行个数:
                                <span id="v-cols"></span>
                            </label>
                            <input id="p-cols" type="range" min="4" max="12" step="1">
                        </div>
                        <div class="row"><label>图标圆角 <span id="v-radius"></span></label><input id="p-radius"
                                type="range" min="0" max="50" step="2"></div>
                        <div class="row"><label>引擎logo圆角 <span id="v-eradius"></span></label><input id="p-eradius"
                                type="range" min="0" max="50" step="2"></div>
                    </section>
                    <!-- 字体大小 -->
                    <section id="tab-font" class="p-page">
                        <h3>字体</h3>
                        <div class="row"><label>字体</label><select id="p-font"></select></div>
                        <div class="row"><label>字体颜色</label><input id="p-fontcolor" type="color"></div>
                        <div class="row"><label>时间/日期/诗词 <span id="v-fsmain"></span></label><input id="p-fsmain"
                                type="range" min="14" max="26" step="1"></div>
                        <div class="row"><label>天气 <span id="v-fswx"></span></label><input id="p-fswx" type="range"
                                min="12" max="20" step="1"></div>
                    </section>
                </div>
            </div>
            <footer><button id="p-save" class="btn primary">保存设置</button></footer>
        </aside>
    </div>

    <!-- 添加搜索引擎弹窗 -->
    <div id="edlg-mask" class="mask hidden center">
        <div id="dlg">
            <h3>添加搜索引擎</h3>
            <input id="e-name" placeholder="引擎名称，如：必应">
            <input id="e-logo" placeholder="图标 URL（留空自动取网站图标）">
            <input id="e-url" placeholder="搜索 URL，如：https://cn.bing.com/search?q=">
            <div class="dlg-btns">
                <button id="e-cancel" class="btn">取消</button>
                <button id="e-ok" class="btn primary">添加</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑快捷方式弹窗 -->
    <div id="dlg-mask" class="mask hidden center">
        <div id="dlg">
            <h3 id="d-title">添加 shortcut</h3>
            <div class="dlg-row"><label class="req">名称</label><input id="d-name" placeholder="必填，如：哔哩哔哩"></div>
            <div class="dlg-row"><label class="req">网址</label><input id="d-url"
                    placeholder="必填，如：https://www.bilibili.com"></div>
            <div class="dlg-row"><label>图标链接</label><input id="d-icon" placeholder="非必填，留空自动获取网站图标"></div>
            <div class="dlg-btns">
                <button id="d-cancel" class="btn">取消</button>
                <button id="d-ok" class="btn primary">保存</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/lunar.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/wallpaper.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/search.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/poetry.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
